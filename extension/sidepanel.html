<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Second Look</title>
  <link rel="stylesheet" href="sidepanel.css">
  <link rel="stylesheet" href="premium.css">
</head>
<body>
  <!-- Shared SVG symbols -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8B7CFF"/>
        <stop offset=".55" stop-color="#5B8CFF"/>
        <stop offset="1" stop-color="#4FD1C5"/>
      </linearGradient>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11.5" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="3" fill="currentColor"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5a7.6 7.6 0 0 0-2.6 1.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M17 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3.5 12.3V4.5a1 1 0 0 1 1-1h7.8l8.2 8.2a1.4 1.4 0 0 1 0 2l-5.8 5.8a1.4 1.4 0 0 1-2 0z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="currentColor"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19h16M5 15l4-4.5 3.5 3L19 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-store" viewBox="0 0 24 24"><path d="M4 9.5L5.5 4h13L20 9.5M4 9.5h16M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0M5.5 12.5V20h13v-7.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
      <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4L3.5 7.5 7 11M3.5 7.5H17M17 13l3.5 3.5L17 20M20.5 16.5H7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-coins" viewBox="0 0 24 24"><ellipse cx="9" cy="7" rx="5.5" ry="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 7v4c0 1.4 2.5 2.5 5.5 2.5M3.5 11v4c0 1.4 2.5 2.5 5.5 2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><ellipse cx="15" cy="13" rx="5.5" ry="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.5 13v4c0 1.4 2.5 2.5 5.5 2.5s5.5-1.1 5.5-2.5v-4" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15zM10 20.5a2.2 2.2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></symbol>
      <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 7.5l7.5 5.5 7.5-5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6L4.5 10.5l5.6-1.9z" fill="currentColor"/></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4l9 15.5H3z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M12 10v4M12 17h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 28 28" width="24" height="24"><circle cx="14" cy="14" r="12" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="14" cy="14" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M14 14 L21 6.5" stroke="#C8A25E" stroke-width="1.6" stroke-linecap="round"/><circle cx="14" cy="14" r="1.6" fill="#C8A25E"/></svg>
        </span>
        <span class="brand-name">Second <i>Look</i></span>
      </div>
      <div class="top-right">
        <div id="savings" class="savings-pill" hidden title="Total saved with Second Look">
          <span class="savings-emoji" aria-hidden="true">💰</span><span id="savingsAmt" class="num">$0</span><span class="savings-label">saved</span>
        </div>
        <button id="statusPill" class="status-pill" data-state="offline" title="Connection status">
          <span class="dot"></span><span class="label">Offline</span>
        </button>
        <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings" aria-expanded="false">
          <svg width="18" height="18"><use href="#i-gear"/></svg>
        </button>
      </div>
    </header>

    <section id="settings" class="settings" hidden>
      <div class="settings-inner">
        <label class="field">
          <span class="field-label">Backend URL</span>
          <div class="field-row">
            <input id="urlInput" type="text" spellcheck="false" autocomplete="off" placeholder="ws://localhost:8000/ws">
            <button id="urlSave" class="btn btn-primary">Save</button>
          </div>
        </label>
        <div class="field">
          <span class="field-label">Appearance</span>
          <div class="segmented" id="themeSeg" role="radiogroup">
            <button data-theme-opt="system" role="radio">System</button>
            <button data-theme-opt="dark" role="radio">Dark</button>
            <button data-theme-opt="light" role="radio">Light</button>
          </div>
        </div>
        <div class="field">
          <span class="field-label">Microphone</span>
          <div class="field-row">
            <button id="micPermBtn" class="btn">Grant microphone access</button>
            <span id="micPermState" class="muted small"></span>
          </div>
        </div>
      </div>
    </section>

    <main class="scroll" id="scroll">
      <section id="product" class="product empty" aria-live="polite">
        <div class="product-img"><img id="productImg" alt=""></div>
        <div class="product-body">
          <div class="product-site" id="productSite">No product detected</div>
          <div class="product-title" id="productTitle">Open a product page on Amazon, Best Buy, Walmart or Target.</div>
          <div class="product-price-row">
            <span class="product-price num" id="productPrice"></span>
            <span class="product-list num" id="productList"></span>
            <span class="product-rating" id="productRating"></span>
          </div>
        </div>
      </section>

      <section id="stage" class="stage" data-state="idle">
        <button id="micBtn" class="mic" data-state="idle" aria-label="Start talking">
          <span class="mic-halo"></span>
          <span class="mic-ring r1"></span>
          <span class="mic-ring r2"></span>
          <span class="mic-spin"></span>
          <span class="mic-core">
            <svg class="ic-mic" width="30" height="30"><use href="#i-mic"/></svg>
            <svg class="ic-stop" width="26" height="26"><use href="#i-stop"/></svg>
          </span>
        </button>
        <div class="stage-text">
          <div class="stage-title" id="stageTitle">Take a second look</div>
          <div class="stage-sub" id="stageSub">Tap the mic and ask anything about this product.</div>
        </div>
      </section>

      <div id="micBanner" class="banner" hidden>
        <svg width="18" height="18"><use href="#i-mic"/></svg>
        <div class="banner-text" id="micBannerText">Microphone access is needed. Chrome can't ask inside the side panel.</div>
        <button id="micBannerBtn" class="btn btn-sm">Grant</button>
      </div>

      <section id="activity" class="activity" hidden></section>

      <section class="section" id="insightsSection" hidden>
        <div class="section-head">
          <span class="section-label">Findings</span>
          <button id="clearCards" class="link-btn">Clear</button>
        </div>
        <div id="cards" class="cards"></div>
      </section>

      <section class="section" id="convoSection" hidden>
        <div class="section-head"><span class="section-label">Conversation</span></div>
        <div id="transcript" class="transcript"></div>
      </section>

      <div class="scroll-pad"></div>
    </main>

    <footer class="dock">
      <div class="quick" id="quick">
        <button class="chip-q" data-text="Is this a good price right now?">Good price?</button>
        <button class="chip-q" data-text="Are the reviews for this product real?">Real reviews?</button>
        <button class="chip-q" data-text="Is this cheaper anywhere else?">Cheaper elsewhere?</button>
        <button class="chip-q" data-text="Watch this for a price drop and email me.">Watch for a drop</button>
      </div>
      <form id="composer" class="composer" autocomplete="off">
        <input id="textInput" type="text" placeholder="Ask about this product…" aria-label="Type a question">
        <button id="sendBtn" type="submit" class="send" aria-label="Send" disabled>
          <svg width="18" height="18"><use href="#i-send"/></svg>
        </button>
      </form>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="runner.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
